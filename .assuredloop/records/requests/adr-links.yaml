    signed: 2026-10-16T23:07Z
    source: owner chat with the architect, 2026-10-16 about 23:06Z
    words: Sign
    presented: "R1's heading 'R1 Trace links on ADRs', its body from 'Links may be added to the marker of an accepted ADR' to 'The review view marks each ADR it names that has no `source:`.', and the Out: line, each word for word as in request.md at f99db56; the marker line was not shown."
    transcribed_by: the agent (architect)
    covers:
      - { id: R1, version: 1, sha256: 6ba0f7ea43e372f370501d48e4a2b84123da469dbd7e10bf19697f13de4a6644 }
decisions:
  - id: D1
    date: 2026-10-16
    source: the agent (architect), the developer's task prompt, 2026-10-16
    text: '"Nothing else changes" means: the same ID and kind, every old link still there with the same target, only new links added, and the text below the marker unchanged as `adrBody` compares it today. A changed or removed link stays `adr-changed`.'
    sha256: d7d5117d73a8c2d992750065fe25056691add2cec8ae3382e568ceca100368d7
  - id: D2
    date: 2026-10-16
    source: the agent (architect), the developer's task prompt, 2026-10-16
    text: "A superseded ADR gets no missing-link hint: it is history."
    sha256: a72c45b467477ec319bbca7642813318e6c0e3f8cc19c67a67720897fb5b67cd
  - id: D3
    date: 2026-10-16
    source: the agent (architect), the developer's task prompt, 2026-10-16
    text: "No config setting. The missing-link finding follows the existing pattern for a paragraph with no link: a hint by default, `not ok` under `--strict`."
    sha256: bb6801e36f57868c06ed72849d941305bb1c0c35daf771d032a2bdd5abb6364b
  - id: D4
    date: 2026-10-16
    source: the agent (architect), the developer's task prompt, 2026-10-16
    text: The review view is the one `al context --for review` gives. Where it names an ADR (for example "check that ADR-3 still holds"), it says that the ADR has no `source:` when that is so. Nothing else is added to it.
    sha256: d1cc2edcee0065411e510ec9b88ee49a78ad9ecb958d36f949c26e468b4207f6
  - id: D5
    date: 2026-10-16
    source: the agent (architect), the developer's task prompt, 2026-10-16
    text: "Design paragraphs are out: in this model a design paragraph has no `source:` link, and its authority is the signed requirement it serves. Write that as an Out: line in the request."
    sha256: 9b5edab048b0b15f984af15a952ee164752263b3c08d3671caf1feb2ec747d48
  - id: D6
    date: 2026-10-16
    source: the agent (architect), the developer's task prompt, 2026-10-16
    text: "Docs: the README and the skill say that links can be added to an accepted ADR, and that `--strict` asks each proposed or accepted ADR for `source:` and `decides:`. Release notes will say that a project with ADRs that lack them fails `--strict` until it adds them."
    sha256: 9c2a0fea8db3a02ae09d335abdc42cce34e9bd1ab65a08dfe17b237bbb3d8c86
  - id: D7
    date: 2026-10-16
    source: the agent (architect), the developer's task prompt, 2026-10-16
    text: In the PR body, say what SCH-22, DES-22 and any other changed paragraph said before and after.
    sha256: 9ee99502b7ac2bb0d8186ed072685fe3551d335ab3e6ca8790d31f42e78f8cb7
