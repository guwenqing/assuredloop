decisions:
  - id: D1
    date: 2026-10-25
    source: the agent (architect)
    text: "An item's file scope is a files: token in its marker line, with globs joined by commas, and files:** for all files; the token is not text and no link, and the list shows an item whose scope the change edits (LD-26)."
    sha256: 5c62366059c3705b6bfc2866275dd39f3ec87333d112edbf8aa68c0c8986a400
    clarifies:
      - R1
  - id: D2
    date: 2026-10-25
    source: the agent (architect)
    text: A design line may name <repo>:<path> of an output repo, read at its selected commit; a saved work item gives a design only when a task of the change's own request names it (LD-48).
    sha256: 859d0b1f182f28d956a820e5b64d90c7b2de0932a84a385032ae13019ca97563
    clarifies:
      - R1
  - id: D3
    date: 2026-10-25
    source: the agent (architect)
    text: "Refines D2: in an output repo the list reads the central repo's items in force at its selected commit, shows the ones cited as central:<ID> and the all-files ones, names the rest, and does not match file scopes there; a saved item's design may also be a Design: line in its body; items in YAML or Markdown files are a later change (LD-25, LD-48)."
    sha256: 6905fb38d613641a0947e182ae57162b4f174210fe20790888276318a62609b4
    clarifies:
      - R1
