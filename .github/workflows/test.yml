name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: npm ci
      # The pack checks install the packed search package with no network, so
      # npm's cache needs its dependencies: the archives and the registry's
      # metadata, which only an install without a lock stores. A scratch copy
      # keeps packages/search/node_modules absent, so the real-model tests
      # skip. No install scripts run, and no release newer than 24 hours is
      # taken (design.md 17). The cached metadata still lists newer releases,
      # whose archives are not cached, so the offline install needs the same
      # cutoff: npm_config_before carries it to the later steps.
      - name: Fill npm's cache with the search package's dependencies
        run: |
          before="$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "npm_config_before=$before" >> "$GITHUB_ENV"
          deps="$RUNNER_TEMP/search-deps"
          mkdir -p "$deps"
          cp packages/search/package.json "$deps/"
          cd "$deps"
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund --before "$before"
      - run: node --test
      - run: npm install --global .
      - run: al check --strict
