# Publishes @assuredloop/cli to npm when a GitHub Release is published, and at
# no other time: a release is made by hand, so a person decides every version
# that goes out.
#
# No npm token is stored anywhere. npm trusts this repository and this file by
# name (npm's trusted publishing): the publish job asks GitHub for a short-lived
# identity token, and npm checks it. That needs npm 11.5.1 or newer, which the
# Node pinned below carries. npm adds a provenance statement (which commit built
# the package) only when the repository is public; from a private one it
# publishes without it.

name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The checks test.yml runs, against the commit the release points at, on the
  # floor `engines.node` promises and on the Node that publishes. Nothing is
  # published from a commit that does not pass them. `node --test` includes the
  # pack check, which installs the packed tarball and runs `al` from it.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [24.21.0, 25.8.0]
    steps:
      # The whole history, so `al check` can compare with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node --test
      - run: npm install --global .
      - run: al check --strict
      # The real-model smoke test (#220; design.md 11: "plus one smoke test with
      # a real model"). npm ci leaves out the library, the repo's optional
      # peer, so this step installs it beside al. npm installs the repo's own
      # peer only with --save-peer; --no-save keeps package.json and the lock
      # as they are. No install scripts run, and no release newer than 24 hours
      # is taken (design.md 17). It comes after node --test, whose tests of al
      # without the library skip when the library is there.
      - name: Install @huggingface/transformers 4.3.1 beside al
        run: |
          before="$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)"
          npm install --no-save --save-peer --ignore-scripts --no-audit --no-fund --before "$before" @huggingface/transformers@4.3.1
      # AL_REQUIRE_REAL_MODEL=1: the test fails, not skips, when the library or
      # the model does not load, so no release goes out without it. It
      # downloads the model. The tests of #39 run here too: level 2 loads with
      # the network blocked after the first download, and the first download
      # fetches each file at the pinned revision.
      - name: The real-model smoke test
        env:
          AL_REQUIRE_REAL_MODEL: 1
        run: node --test test/search-real-model.test.js test/search-offline-39.test.js

  # The only job that can prove who it is to npm, so it installs nothing.
  # Publishing packs the files package.json lists and needs no dependencies to
  # do it. It needs the test job on both Nodes: a matrix job passes only when
  # all its legs did.
  publish:
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.8.0
          registry-url: https://registry.npmjs.org
      # The release names the version; package.json is what npm publishes. They
      # have to agree, or the release says one version and npm gets another.
      - name: The release tag is v<package.json version>
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$want" ]; then
            echo "The release is tagged $TAG and package.json says $want. Make them agree, then publish the release again."
            exit 1
          fi
      # A pre-release goes out under `next`, so `npm install` keeps getting the
      # last full release. A version already on npm is skipped, so a re-run
      # of a release that was published does not fail here.
      - name: npm publish @assuredloop/cli
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "@assuredloop/cli@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "@assuredloop/cli $version is already on npm: skipping its publish."
          elif [ "$PRERELEASE" = "true" ]; then npm publish --tag next; else npm publish; fi
